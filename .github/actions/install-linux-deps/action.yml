name: Install Linux system dependencies
description: >-
  Tauri's Linux prerequisites (webkit2gtk 4.1, GTK3, SSL, XDO). Required by any
  job that runs cargo against this crate — without them glib-sys fails to
  resolve its pkg-config dependencies.

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libxdo-dev